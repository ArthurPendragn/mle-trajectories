[project]
name = "mle-trajectories"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "gcsfs",           # data-lake runs (nyc-housing-violation) read gs:// -- pinned below
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "litellm>=1.97.0",
    "psutil>=7.2.2",
    "skorch>=1.4.0",
    "stratum-ai",
    "tenacity>=8.0",   # litellm retry path (num_retries) imports it lazily
    "torch>=2.13.0",
    "xgboost>=3.3.0",
]

[project.scripts]
pipeline-analyzer = "pipeline_analyzer.__main__:main"
pipeline-runtime = "pipeline_analyzer.runtime:main"
skrubify = "skrubify.__main__:main"
dataset-sample = "dataset_sample.__main__:main"
code-stats = "code_stats.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/code_stats", "tools/dataset_sample", "tools/pipeline_analyzer", "tools/skrubify"]

# The default PyPI torch wheel is built against CUDA 13.0, which this machine's
# driver (12.7) refuses -- torch.cuda.is_available() comes back False and every
# pipeline silently falls back to CPU. Pin torch to the cu126 index, the same
# build mle-star uses on this box.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# stratum from the main branch; pinned by commit (uv fetches the rev from any branch)
stratum-ai = { git = "https://github.com/deem-data/stratum.git", rev = "c2de0f8e4e4e1a40c544374997f1ae69aed243b4" }
torch = { index = "pytorch-cu126" }
# The gcsfs 2026.8.1 release can deadlock closing a file (prefetcher close ->
# "Calling sync() from within a running loop"); a data-lake pipeline then hangs
# forever. Pin the commit with the fix -- the same one mle-claude uses.
gcsfs = { git = "https://github.com/fsspec/gcsfs", rev = "9290d6f242eeb3e9d6b539f2f0beae017315f32a" }

[dependency-groups]
website = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
