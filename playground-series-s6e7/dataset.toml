label = "Playground series S6E7"
task = "classification"
data = "gs://mle-trajectories-data/playground-series-s6e7/input"
note = "Original Kaggle train/test files on GCS; hidden evaluation uses Kaggle. get_data.sh retains the local acquisition path."

[metric]
name = "balanced_accuracy"
lower_is_better = false

[sample]                       # python -m dataset_sample playground-series-s6e7 --size 10k
script = "make_sample.py"      # stratified on health_condition with an n_splits floor; see its docstring
out_env = "S6E7_OUT"
size_env = "S6E7_N_TRAIN"      # train rows; test keeps the script's S6E7_N_TEST (5,000)
